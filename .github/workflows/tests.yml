name: CHIMERA Test Suite

on:
  push:
    branches: [ main, dev, chimera-repair ]
  pull_request:
    branches: [ main, dev, chimera-repair ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    - name: Install CPU-only dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install einops numpy scipy pytest

    - name: Compile Python sources
      run: |
        python -m compileall -q chimera data scripts tests

    - name: Validate documented architecture contract
      run: python scripts/validate_repo_contract.py

    - name: Run CPU scientific and integration tests
      run: |
        pytest tests/ -v --tb=short -m "not gpu and not requires_weights"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: pip install black
    - name: Check Python files changed by this commit
      shell: bash
      run: |
        files=$(git diff-tree --no-commit-id --name-only -r HEAD | grep '\.py$' || true)
        if [ -z "$files" ]; then
          echo "No Python files changed in this commit."
        else
          black --check $files
        fi
